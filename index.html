<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Sentence Building Cards</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f2f6fc;
      color: #24324a;
    }

    h1, h2 { text-align: center; }

    #cartes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    .carte {
      width: 170px;
      padding: 12px;
      border: 3px solid #d4dfef;
      border-radius: 16px;
      background: white;
      text-align: center;
      cursor: pointer;
      font-size: 20px;
    }

    .carte:hover { border-color: #527de5; }

    .carte img {
      width: 140px;
      height: 110px;
      object-fit: contain;
    }

    .carte button, #vider {
      margin: 5px;
      padding: 8px 12px;
      border: 0;
      border-radius: 8px;
      background: #e4ebfa;
      cursor: pointer;
      font-size: 16px;
    }

    #zonePhrase {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 90px;
      padding: 15px;
      background: white;
      border: 2px dashed #9aafd2;
      border-radius: 14px;
    }

    .mot {
      padding: 10px;
      border-radius: 10px;
      background: #e8f0ff;
      text-align: center;
    }

    .mot button { cursor: pointer; }

    .actions {
      text-align: center;
      margin: 15px;
    }
  </style>
</head>
<body>
  <h1>My Sentence Building Cards</h1>

  <h2>Choose your cards</h2>
  <div id="cartes"></div>

  <h2>My sentence</h2>
  <div id="zonePhrase">Choose a card to get started.</div>

  <div class="actions">
    <button id="vider">Clear my sentence</button>
  </div>

  <script>
   const categories = [
  {
    name: "TIME",
    question: "When?",
    cards: ["morning.jpg", "afternoon.jpg", "evening.jpg", "night.jpg"]
  },
  {
    name: "ANIMAL",
    question: "Who?",
    cards: [
      "bear.jpg", "beaver.jpg", "camel.jpg", "cow.jpg",
      "deer.jpg", "dog.jpg", "fox.jpg", "marmot.jpg",
      "rabbit.jpg", "redpanda.jpg", "scorpion.jpg",
      "sheep.jpg", "snowleopard.jpg", "squirrel.jpg",
      "turtle.jpg"
    ]
  },
  {
    name: "ACTION",
    question: "What is it doing?",
    cards: [
      "eating.jpg", "hiding.jpg", "jumping.jpg",
      "playing.jpg", "reading.jpg", "running.jpg",
      "singing.jpg", "sitting.jpg", "sleeping.jpg",
      "spinning.jpg"
    ]
  },
  {
    name: "PLACE",
    question: "Where?",
    cards: [
      "desert.jpg", "farm.jpg", "forest.jpg",
      "mountains.jpg", "sea.jpg"
    ]
  }
];

let selection = [null, null, null, null];

function afficherCartes() {
  const zone = document.getElementById("cartes");
  zone.replaceChildren();

  const prochaineCategorie = selection.findIndex(carte => carte === null);

  if (prochaineCategorie === -1) {
    zone.textContent = "Well done! You have built your sentence!";
    return;
  }

  const categorie = categories[prochaineCategorie];

  const titre = document.createElement("h2");
  titre.textContent = categorie.name + " – " + categorie.question;
  zone.appendChild(titre);

  const grille = document.createElement("div");
  grille.style.display = "flex";
  grille.style.flexWrap = "wrap";
  grille.style.justifyContent = "center";
  grille.style.gap = "16px";
  grille.style.width = "100%";

  categorie.cards.forEach(fichier => {
    const bloc = document.createElement("div");
    bloc.className = "carte";

    const image = document.createElement("img");
    image.src = fichier;
    image.alt = categorie.name + " card";
    image.style.width = "140px";
    image.style.height = "110px";
    image.style.objectFit = "contain";

    bloc.appendChild(image);

    bloc.onclick = () => {
      selection[prochaineCategorie] = fichier;
      afficherPhrase();
      afficherCartes();
    };

    grille.appendChild(bloc);
  });

  zone.appendChild(grille);
}

function afficherPhrase() {
  const zone = document.getElementById("zonePhrase");
  zone.replaceChildren();

  selection.forEach((fichier, index) => {
    if (!fichier) return;

    const bloc = document.createElement("div");
    bloc.className = "mot";

    const image = document.createElement("img");
    image.src = fichier;
    image.alt = categories[index].name;
    image.style.width = "110px";
    image.style.height = "90px";
    image.style.objectFit = "contain";

    const retirer = document.createElement("button");
    retirer.textContent = "×";
    retirer.title = "Remove this card";

    retirer.onclick = () => {
      selection[index] = null;

      // Clear all later choices to preserve the required order.
      for (let i = index + 1; i < selection.length; i++) {
        selection[i] = null;
      }

      afficherPhrase();
      afficherCartes();
    };

    bloc.append(image, retirer);
    zone.appendChild(bloc);
  });

  if (selection.every(carte => carte !== null)) {
    const message = document.createElement("p");
    message.textContent = "Great job! Your sentence is complete!";
    message.style.width = "100%";
    message.style.textAlign = "center";
    zone.appendChild(message);
  } else if (selection.every(carte => carte === null)) {
    zone.textContent = "Choose a TIME card to get started.";
  }
}

document.getElementById("vider").textContent = "Clear my sentence";

document.getElementById("vider").onclick = () => {
  selection = [null, null, null, null];
  afficherPhrase();
  afficherCartes();
};

afficherCartes();
afficherPhrase();
  </script>
</body>
</html>
